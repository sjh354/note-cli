name: release

# Publishes to PyPI when a v* tag is pushed. Uses PyPI Trusted Publishing, so
# there is no API token to store — but it only works once the project is
# configured on PyPI with this repo and workflow filename as a trusted
# publisher. See RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
